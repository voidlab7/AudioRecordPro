id: task-0504-ui-onboarding
title: 设计首次启动引导和权限状态可视化
project: audio-record
type: design
priority: 75
max_minutes: 45

route: 绘·设计 → 矩·架构
reviewers:
  - 设计_绘
  - 架构_矩

requirement_doc: requirements/task-0504-ui-onboarding.md

allowed_actions:
  - read
  - edit
  - test
  - local_commit

forbidden_actions:
  - push
  - deploy
  - delete_data

context: |
  当前启动流程 setupInitialState() 加载后显示"准备就绪"，新用户无引导。
  权限状态没有可视化，用户直到录制失败才知道权限问题。

  详细需求参见: ai-workspace/queue/requirements/task-0504-ui-onboarding.md

instructions:
  - 阅读需求文档 ai-workspace/queue/requirements/task-0504-ui-onboarding.md
  - 设计师 Review：首次启动 3 步引导的视觉设计（Coach Mark / Spotlight / 卡片）
  - 设计师 Review：StatusBar 权限图标设计（颜色编码+尺寸+位置）
  - 设计师 Review：权限被拒绝时的警告 badge 设计
  - 架构师 Review：首次启动检测方案（UserDefaults flag）
  - 架构师 Review：引导覆盖层实现方式（overlay view vs popover vs sheet）
  - 架构师 Review：权限状态实时监听并同步到 StatusBar 的方案
  - 输出 artifacts/03-design/design-spec.md（引导视觉设计+权限图标规范）
  - 输出 artifacts/03-design/architecture-review.md（实现方案+生命周期管理）

acceptance:
  - artifacts/02-requirement/ 中存在需求文档副本
  - artifacts/03-design/design-spec.md 包含引导流程设计和权限可视化规范
  - artifacts/03-design/architecture-review.md 包含技术实现方案
  - 生成 artifacts/06-summary/workflow-summary.md
  - 无 push/deploy/delete_data 操作
