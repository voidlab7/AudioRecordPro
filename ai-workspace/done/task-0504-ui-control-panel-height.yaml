id: task-0504-ui-control-panel-height
title: 压缩ControlPanel高度释放TracksView空间
project: audio-record
type: design
priority: 78
max_minutes: 45

route: 绘·设计 → 矩·架构
reviewers:
  - 设计_绘
  - 架构_矩

requirement_doc: requirements/task-0504-ui-control-panel-height.md

allowed_actions:
  - read
  - edit
  - test
  - local_commit

forbidden_actions:
  - push
  - deploy
  - delete_data

context: |
  当前 ControlPanelView 固定高度 150px，占窗口 500px 的 30%。
  实际内容信息密度低，大量空间用于按钮间距和视觉装饰。TracksView 被压缩到仅 ~84px。

  详细需求参见: ai-workspace/queue/requirements/task-0504-ui-control-panel-height.md

instructions:
  - 阅读需求文档 ai-workspace/queue/requirements/task-0504-ui-control-panel-height.md
  - 设计师 Review：评估压缩方案（150px → 120px / 100px / 90px）
  - 设计师 Review：按钮尺寸是否需要调整（64px → 52px?）
  - 设计师 Review：计时器与 header 是否可以合并为一行
  - 架构师 Review：高度约束修改对动画系统的影响
  - 架构师 Review：是否改为自适应高度（intrinsicContentSize）
  - 输出 artifacts/03-design/design-spec.md（布局方案+视觉对比）
  - 输出 artifacts/03-design/architecture-review.md（约束修改方案+风险）

acceptance:
  - artifacts/02-requirement/ 中存在需求文档副本
  - artifacts/03-design/design-spec.md 包含高度方案和视觉对比（ASCII 或描述）
  - artifacts/03-design/architecture-review.md 包含约束修改点和动画影响评估
  - 生成 artifacts/06-summary/workflow-summary.md
  - 无 push/deploy/delete_data 操作
