id: task-0504-ui-splitview-divider
title: 优化SplitView分隔线视觉反馈
project: audio-record
type: design
priority: 70
max_minutes: 30

route: 绘·设计 → 矩·架构
reviewers:
  - 设计_绘
  - 架构_矩

requirement_doc: requirements/task-0504-ui-splitview-divider.md

allowed_actions:
  - read
  - edit
  - test
  - local_commit

forbidden_actions:
  - push
  - deploy
  - delete_data

context: |
  当前 NSSplitView 使用 .thin 分隔线，视觉上不明显，用户不知道可以拖动调整。
  缺少 hover 和拖动时的视觉反馈，与 Industrial Design 其他交互元素不一致。

  详细需求参见: ai-workspace/queue/requirements/task-0504-ui-splitview-divider.md

instructions:
  - 阅读需求文档 ai-workspace/queue/requirements/task-0504-ui-splitview-divider.md
  - 设计师 Review：分隔线 hover 状态的视觉设计（颜色、宽度、动画）
  - 设计师 Review：是否需要拖动手柄/指示器图标
  - 设计师 Review：默认状态与 hover 状态的视觉对比
  - 架构师 Review：自定义 NSSplitView divider 绘制的最佳实现方式
  - 架构师 Review：hover 检测方案（子类化 vs overlay view vs tracking area）
  - 输出 artifacts/03-design/design-spec.md（分隔线状态视觉规范）
  - 输出 artifacts/03-design/architecture-review.md（技术实现方案选型）

acceptance:
  - artifacts/02-requirement/ 中存在需求文档副本
  - artifacts/03-design/design-spec.md 包含分隔线各状态视觉规范
  - artifacts/03-design/architecture-review.md 包含技术方案和选型理由
  - 生成 artifacts/06-summary/workflow-summary.md
  - 无 push/deploy/delete_data 操作
