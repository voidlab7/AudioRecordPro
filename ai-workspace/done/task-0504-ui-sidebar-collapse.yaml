context: |
  当前 MainWindowView.swift 中 NSSplitViewDelegate 的 canCollapseSubview 返回 false（第312行），
  导致 Sidebar 始终占据 240px 且不可折叠。用户无法在需要更多内容区空间时隐藏侧边栏。

  详细需求参见: ai-workspace/queue/requirements/task-0504-ui-sidebar-collapse.md

instructions:
  - 阅读需求文档 ai-workspace/queue/requirements/task-0504-ui-sidebar-collapse.md
  - 设计师 Review：评估 Sidebar 折叠时的视觉过渡动画方案
  - 设计师 Review：折叠按钮的位置和图标设计（toolbar? sidebar 顶部?）
  - 架构师 Review：canCollapseSubview 改为对 sidebarView 返回 true 的影响
  - 架构师 Review：添加 ⌘+Shift+S 快捷键绑定方案
  - 架构师 Review：Sidebar 显示状态持久化方案（UserDefaults）
  - 确保启动时 Sidebar 默认展示（当前行为保持不变）
  - 输出 artifacts/03-design/design-spec.md（设计师产出）
  - 输出 artifacts/03-design/architecture-review.md（架构师产出）

acceptance:
  - artifacts/02-requirement/ 中存在需求文档副本
  - artifacts/03-design/design-spec.md 包含折叠动画方案、按钮设计、视觉规范
  - artifacts/03-design/architecture-review.md 包含技术方案、快捷键方案、持久化方案
  - 明确折叠动画方案、快捷键方案、持久化方案
  - 生成 artifacts/06-summary/workflow-summary.md
  - 无 push/deploy/delete_data 操作
