id: task-0504-ui-sidebar-collapse
title: 为Sidebar添加折叠/展开能力和快捷键
project: audio-record
type: design
priority: 92
max_minutes: 60

route: 绘·设计 → 矩·架构
reviewers:
  - 设计_绘
  - 架构_矩

requirement_doc: requirements/task-0504-ui-sidebar-collapse.md

allowed_actions:
  - read
  - edit
  - test
  - local_commit

forbidden_actions:
  - push
  - deploy
