id: task-0504-ui-tab-naming
title: 优化Sidebar Tab命名与录制完成后自动切换
project: audio-record
type: design
priority: 83
max_minutes: 45

route: 绘·设计 → 矩·架构
reviewers:
  - 设计_绘
  - 架构_矩

requirement_doc: requirements/task-0504-ui-tab-naming.md

allowed_actions:
  - read
  - edit
  - test
  - local_commit

forbidden_actions:
  - push
  - deploy
  - delete_data

context: |
  当前 SidebarView 有两个 Tab：Tab1 "Audio Recorder"（命名与应用重复），Tab2 "Saved Files"。
  用户录完后需手动切换 Tab 才能看到新文件，缺少引导。

  详细需求参见: ai-workspace/queue/requirements/task-0504-ui-tab-naming.md

instructions:
  - 阅读需求文档 ai-workspace/queue/requirements/task-0504-ui-tab-naming.md
  - 设计师 Review：Tab 命名方案（"INPUT"/"FILES" 或 "SOURCE"/"RECORDINGS"）
  - 设计师 Review：录制完成后自动切换到文件 Tab 的过渡动画
  - 设计师 Review：新文件高亮动画设计（颜色、持续时间、节奏）
  - 设计师 Review：是否考虑取消 Tab 改为上下分栏
  - 架构师 Review：TabContainerView 新增 selectTab(id:animated:) 的实现方案
  - 架构师 Review：handleRecordingComplete 中触发自动切换的时序控制
  - 输出 artifacts/03-design/design-spec.md（命名方案+交互动画设计）
  - 输出 artifacts/03-design/architecture-review.md（技术实现方案）

acceptance:
  - artifacts/02-requirement/ 中存在需求文档副本
  - artifacts/03-design/design-spec.md 包含 Tab 命名建议、动画规范、交互流程图
  - artifacts/03-design/architecture-review.md 包含代码修改方案和时序图
  - 生成 artifacts/06-summary/workflow-summary.md
  - 无 push/deploy/delete_data 操作
