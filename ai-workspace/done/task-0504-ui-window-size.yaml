id: task-0504-ui-window-size
title: 优化默认窗口尺寸适配Sidebar布局
project: audio-record
type: design
priority: 85
max_minutes: 45

route: 绘·设计 → 矩·架构
reviewers:
  - 设计_绘
  - 架构_矩

requirement_doc: requirements/task-0504-ui-window-size.md

allowed_actions:
  - read
  - edit
  - test
  - local_commit

forbidden_actions:
  - push
  - deploy
  - delete_data

context: |
  当前窗口初始尺寸 800×500，Sidebar 宽 240px，内容区仅剩 560px。
  ControlPanel 固定 150px + StatusBar 28px + 波形区 42%，导致 TracksView 空间极其有限。

  详细需求参见: ai-workspace/queue/requirements/task-0504-ui-window-size.md

instructions:
  - 阅读需求文档 ai-workspace/queue/requirements/task-0504-ui-window-size.md
  - 设计师 Review：评估最佳默认尺寸（候选 960×600 / 1024×600 / 1024×640）
  - 设计师 Review：Sidebar 宽度是否需要从 240 调整到 260-280
  - 设计师 Review：各区域高度比例优化方案
  - 架构师 Review：窗口响应式布局方案（窗口宽度 < 900px 时自动折叠 Sidebar）
  - 架构师 Review：约束修改点清单和风险评估
  - 考虑不同屏幕分辨率（13寸 vs 16寸 MacBook）的显示效果
  - 输出 artifacts/03-design/design-spec.md（设计师产出：推荐尺寸和比例）
  - 输出 artifacts/03-design/architecture-review.md（架构师产出：约束修改方案）

acceptance:
  - artifacts/02-requirement/ 中存在需求文档副本
  - artifacts/03-design/design-spec.md 包含推荐窗口尺寸、Sidebar 宽度、各区域比例
  - artifacts/03-design/architecture-review.md 包含约束修改清单和响应式方案
  - 生成 artifacts/06-summary/workflow-summary.md
  - 无 push/deploy/delete_data 操作
