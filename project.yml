name: AudioRecordMac
options:
  bundleIdPrefix: com.voidzhang
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 5.9
    MACOSX_DEPLOYMENT_TARGET: 13.0
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

schemes:
  AudioRecordMac:
    build:
      targets:
        AudioRecordMac: all
        AudioRecordMacUITests: [test]
    test:
      gatherCoverageData: false
      targets:
        - name: AudioRecordMacUITests

fileGroups:
  - docs
  - scripts
  - AudioRecordKit

targets:
  AudioRecordMac:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: AudioRecordApp/Sources
      - path: AudioRecordKit/Sources
      - path: assets
        type: folder
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.microlab.loocap
        PRODUCT_NAME: Loocap
        EXECUTABLE_NAME: Loocap
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: AudioRecordMac.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: true
        KNOWN_REGIONS: [Base, en, zh-Hans]
    dependencies: []

  AudioRecordMacUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: AudioRecordMacUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.microlab.loocap.uitests
        TEST_TARGET_NAME: AudioRecordMac
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: AudioRecordMac
